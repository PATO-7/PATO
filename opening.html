<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0B">
  <title>PATO</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0A0A0B; --gold:#B8964E; --champ:#E8DCC0; --ink:#EFE9DC;
      --serif:'Cormorant Garamond',Georgia,serif;
      --sans:'Jost','Segoe UI',system-ui,sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      background:var(--bg); color:var(--ink); font-family:var(--sans);
      overflow:hidden; -webkit-font-smoothing:antialiased;
    }

    /* ============ FULL-SCREEN OPENING PAGE ============ */
    #opening{
      position:fixed; inset:0; width:100vw; height:100svh; min-height:100vh;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
      background:
        radial-gradient(60% 50% at 50% 42%, rgba(184,150,78,.14) 0%, rgba(184,150,78,.05) 45%, transparent 70%),
        radial-gradient(120% 90% at 50% 120%, #17130b 0%, transparent 55%),
        var(--bg);
      transition:opacity 1s ease, visibility 1s, transform 1.1s cubic-bezier(.6,0,.2,1);
    }
    #opening.done{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.06)}

    /* ---- luxury watch IMAGE scene, behind the logo ---- */
    .scene{
      position:absolute; inset:0; z-index:1;
      display:flex; align-items:center; justify-content:center;
      perspective:1100px; pointer-events:none;
    }
    .watch-frame{
      position:relative; width:min(72vmin,560px); height:min(72vmin,560px);
      border-radius:50%;
      animation:riseIn 1.4s cubic-bezier(.16,1,.3,1) both;
    }
    .watch-tilt{
      position:absolute; inset:0; border-radius:50%;
      animation:orbit 7s ease-in-out 1.2s infinite;
      will-change:transform;
    }
    .watch-photo{
      position:absolute; inset:0; width:100%; height:100%;
      object-fit:contain; border-radius:50%;
      filter:brightness(.92) contrast(1.06) saturate(1.05)
             drop-shadow(0 30px 70px rgba(0,0,0,.8))
             drop-shadow(0 0 60px rgba(184,150,78,.25));
      animation:kenburns 8s ease-in-out infinite alternate;
    }
    /* subtle Ken-Burns zoom inside the circle — keeps the still image alive */
    @keyframes kenburns{
      from{transform:scale(1)}
      to  {transform:scale(1.07)}
    }
    /* gold ring around the photo — like a bezel */
    .watch-ring{
      position:absolute; inset:-14px; border-radius:50%; pointer-events:none;
      border:1px solid rgba(184,150,78,.5);
      box-shadow:0 0 30px rgba(184,150,78,.18), inset 0 0 24px rgba(184,150,78,.12);
      animation:ringPulse 3.2s ease-in-out infinite;
    }
    /* light streak sweeping across the image (Ken Burns + shine) */
    .watch-shine{
      position:absolute; inset:0; border-radius:50%; overflow:hidden; pointer-events:none;
      mix-blend-mode:screen;
    }
    .watch-shine::before{
      content:''; position:absolute; top:-30%; left:-60%; width:45%; height:160%;
      background:linear-gradient(100deg, transparent 0%, rgba(237,230,214,.12) 45%,
        rgba(232,220,192,.3) 50%, rgba(237,230,214,.12) 55%, transparent 100%);
      transform:rotate(16deg) translateX(-140%);
      animation:sweep 3.4s cubic-bezier(.5,0,.2,1) .8s infinite;
    }
    /* dark vignette so the logo stays readable on top of the photo */
    .scene::after{
      content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
      background:radial-gradient(46% 46% at 50% 50%, rgba(10,10,11,.72) 0%, rgba(10,10,11,.38) 55%, transparent 78%);
    }

    @keyframes riseIn{
      from{transform:scale(.86) translateY(4vh); opacity:0; filter:blur(10px)}
      to{transform:scale(1) translateY(0); opacity:1; filter:blur(0)}
    }
    /* slow cinematic drift — zoom + tilt, like a camera orbiting the piece */
    @keyframes orbit{
      0%,100%{transform:scale(1.02) rotateY(-7deg) rotateX(3deg) translateY(0)}
      50%    {transform:scale(1.09) rotateY(7deg) rotateX(-3deg) translateY(-1.6vh)}
    }
    @keyframes sweep{
      0%{transform:rotate(16deg) translateX(-140%)}
      55%,100%{transform:rotate(16deg) translateX(380%)}
    }
    @keyframes ringPulse{
      0%,100%{opacity:.55; transform:scale(1)}
      50%    {opacity:1;   transform:scale(1.015)}
    }

    /* full-page cinematic sheen */
    .page-sheen{
      position:absolute; top:-60%; left:-40%; width:38%; height:220%; z-index:3;
      background:linear-gradient(100deg, transparent 0%, rgba(237,230,214,.08) 45%,
        rgba(232,220,192,.18) 50%, rgba(237,230,214,.08) 55%, transparent 100%);
      transform:rotate(14deg) translateX(-160%);
      animation:sweep 3.6s cubic-bezier(.5,0,.2,1) .4s infinite;
      pointer-events:none; mix-blend-mode:screen;
    }

    /* ---- PATO logo, in front of the watch ---- */
    .mark{
      position:relative; z-index:4;
      display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
      transition:transform 1.1s cubic-bezier(.4,0,.2,1), opacity 1.1s ease, filter 1.1s ease;
    }
    #opening.done .mark{transform:translateY(-6vh) scale(1.08); opacity:0; filter:blur(8px)}
    .word{
      font-family:var(--serif); font-weight:500; color:var(--champ);
      font-size:clamp(46px,13vw,92px); line-height:1; letter-spacing:.18em; margin-left:.18em;
      text-shadow:0 0 40px rgba(10,10,11,.95), 0 0 24px rgba(184,150,78,.4);
      animation:wordIn 1.3s .45s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes wordIn{
      from{transform:translateY(22px);opacity:0;letter-spacing:.55em;filter:blur(6px)}
      to{transform:none;opacity:1;letter-spacing:.18em;filter:blur(0)}
    }
    .sub{
      font-weight:300; letter-spacing:.42em; margin-left:.42em; text-transform:uppercase;
      font-size:clamp(9px,2.4vw,12px); color:var(--champ); opacity:0;
      animation:subIn 1.2s 1.1s ease both;
    }
    @keyframes subIn{from{opacity:0;transform:translateY(10px)}to{opacity:.8;transform:none}}

    /* thin gold progress line — shows the 3 seconds passing */
    .timer{
      position:absolute; bottom:calc(env(safe-area-inset-bottom) + 34px); left:50%;
      transform:translateX(-50%); width:min(180px,40vw); height:1px; z-index:4;
      background:rgba(232,220,192,.18); overflow:hidden;
    }
    .timer i{
      display:block; height:100%; width:100%;
      background:linear-gradient(90deg,transparent,var(--gold),var(--champ));
      transform-origin:left center; animation:fill 3s linear .05s both;
    }
    @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

    @media (prefers-reduced-motion: reduce){
      #opening *,#opening *::before{animation-duration:.01s!important;animation-iteration-count:1!important}
    }
  </style>
</head>
<body>

  <!-- ============ PAGE 1 — OPENING (full screen, 3 s) ============ -->
  <div id="opening">
    <!-- animated luxury-watch image behind the logo -->
    <div class="scene">
      <div class="watch-frame">
        <div class="watch-tilt">
          <img class="watch-photo" src="images/naviforce-1.jpg" alt="PATO luxury watch">
          <span class="watch-shine"></span>
        </div>
        <span class="watch-ring"></span>
      </div>
    </div>
    <span class="page-sheen"></span>

    <!-- the logo sits in FRONT of the watch -->
    <div class="mark">
      <h1 class="word">PATO</h1>
      <p class="sub">Haute Horlogerie</p>
    </div>

    <div class="timer"><i></i></div>
  </div>

  <script>
    // Hold the opening page for exactly 3 seconds, then open the start page.
    const HOLD_MS = 3000;
    let finished = false;
    function enterSite() {
      if (finished) return;
      finished = true;
      document.getElementById('opening').classList.add('done');
      setTimeout(() => { location.replace('index.html?started=1'); }, 950);
    }
    setTimeout(enterSite, HOLD_MS);
    document.addEventListener('click', enterSite, { once: true }); // tap to enter immediately
    // safety net: never get stuck on this page
    setTimeout(enterSite, HOLD_MS + 4000);
  </script>
</body>
</html>
